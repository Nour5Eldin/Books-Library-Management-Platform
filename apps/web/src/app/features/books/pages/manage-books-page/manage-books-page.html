<section class="mx-auto flex h-full min-h-0 w-full max-w-7xl flex-1 flex-col px-6 py-10 md:px-12">

    <div class="shrink-0">

        <h1 class="text-3xl font-extrabold text-on-surface md:text-4xl">
            Manage Your Library
        </h1>

        <p class="mt-2 text-muted">
            Add, edit, and organize your collection in one place.
        </p>

        @if (errorMessage()) {

        <p class="mt-4 rounded-field bg-error/10 px-4 py-2 text-sm text-error">
            {{ errorMessage() }}
        </p>

        }

    </div>

    <!-- Main content -->
    <div class="mt-8 min-h-0 flex-1 grid grid-cols-1 gap-6 lg:grid-cols-[360px_minmax(0,1fr)]">

        <!-- Form -->
        <div class="min-h-0 lg:overflow-y-auto lg:pr-2">

            <app-book-form [editingBook]="editingBook" [saving]="saving()" [serverErrors]="serverErrors()"
                [resetTrigger]="formResetTrigger()" (save)="onSave($event)" (cancel)="onCancelEdit()" />

        </div>

        <!-- Books -->
        <div class="flex min-h-0 flex-col">

            <!-- Search -->
            <div
                class="mb-5 flex shrink-0 items-center gap-3 rounded-xl border border-outline bg-surface-card px-5 py-3">

                <button type="button" (click)="onSearch()" aria-label="Search"
                    class="shrink-0 text-muted transition-colors hover:text-primary">

                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />

                    </svg>

                </button>

                <input type="text" [(ngModel)]="searchTerm" (keydown.enter)="onSearch()"
                    placeholder="Search by title, author, or category..."
                    class="w-full bg-transparent text-sm text-on-surface placeholder:text-muted focus:outline-none" />

                @if (searchTerm) {

                <button type="button" (click)="clearSearch()" aria-label="Clear search"
                    class="shrink-0 text-muted transition-colors hover:text-primary">

                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18" />

                    </svg>

                </button>

                }

            </div>

            <!-- Books scrolling area -->
            <div class="min-h-0 flex-1 overflow-y-auto pr-2">

                <app-book-list [books]="books()" [loading]="loading()" [deletingBookId]="deletingBookId()"
                    (edit)="onEdit($event)" (delete)="onDelete($event)" />

            </div>

            <!-- Pagination -->
            <div class="shrink-0 pt-5">

                <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalItems]="totalItems"
                    [pageSize]="pageSize" (pageChange)="goToPage($event)" />

            </div>

        </div>

    </div>

    <!-- Delete Modal -->
    @if (deleteCandidate(); as book) {

    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" (click)="cancelDelete()">

        <div class="w-full max-w-md rounded-card bg-surface-card p-6 shadow-xl" (click)="$event.stopPropagation()">

            <div class="mb-4 flex items-center gap-3">

                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-error/10">

                    <svg class="h-5 w-5 text-error" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5">

                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 9v3.75m0 3.75h.007M10.29 3.86 2.82 17.25A1.5 1.5 0 0 0 4.12 19.5h15.76a1.5 1.5 0 0 0 1.3-2.25L13.71 3.86a1.95 1.95 0 0 0-3.42 0Z" />

                    </svg>

                </div>

                <div>

                    <h2 class="text-lg font-bold text-on-surface">
                        Delete Book
                    </h2>

                    <p class="text-sm text-muted">
                        This action cannot be undone.
                    </p>

                </div>

            </div>

            <p class="text-sm text-on-surface">
                Are you sure you want to remove
                <span class="font-semibold">"{{ book.title }}"</span>
                from BookNest?
            </p>

            <div class="mt-6 flex justify-end gap-3">

                <button type="button" (click)="cancelDelete()"
                    class="rounded-full border border-outline px-5 py-2.5 text-sm font-medium text-muted transition-colors hover:border-primary hover:text-primary">
                    Cancel
                </button>

                <button type="button" [disabled]="deletingBookId()" (click)="confirmDelete()"
                    class="rounded-full bg-error px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-error/90 disabled:cursor-not-allowed disabled:opacity-60">

                    @if (deletingBookId()) {
                    Deleting...
                    } @else {
                    Delete
                    }

                </button>

            </div>

        </div>

    </div>

    }

</section>
